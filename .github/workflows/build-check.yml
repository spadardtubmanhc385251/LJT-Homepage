name: Build check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Inspect generated pages
        run: |
          find _site -maxdepth 2 -name '*.html' | sort
          wc -c _site/index.html _site/publications/index.html
          echo "Publications on the publications page:"
          grep -o -E 'SynLogic|On the Perception Bottleneck of VLMs for Chart Understanding|On the Universal Truthfulness Hyperplane Inside LLMs|In-Context Sharpness as Alerts|C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models|Composing Parameter-Efficient Modules with Arithmetic Operations' _site/publications/index.html
          echo "Publications on the about page:"
          grep -o -E 'SynLogic|On the Perception Bottleneck of VLMs for Chart Understanding|On the Universal Truthfulness Hyperplane Inside LLMs|In-Context Sharpness as Alerts|C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models|Composing Parameter-Efficient Modules with Arithmetic Operations' _site/index.html
          echo "Contact details:"
          grep -o -E 'jliugi@connect.ust.hk|Vicent0205|junteng88716710' _site/index.html | sort -u